name: Check app

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository files
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the exact dependency versions
        run: npm ci

      - name: Run the checks
        run: npm test

      - name: Build the app
        run: npm run build
